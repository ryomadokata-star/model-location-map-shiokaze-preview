<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>モデル現在地MAP</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <section id="accessGate" class="access-gate">
      <div class="access-box">
        <p class="eyebrow">確認用ページ</p>
        <h1>合言葉を入力</h1>
        <input id="accessCode" type="password" placeholder="合言葉" />
        <button id="unlockAccess" type="button">開く</button>
        <p id="accessMessage" class="note">URLを知っている人向けの確認ページです。</p>
      </div>
    </section>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Fresh! 屋外撮影会 1部</p>
          <h1>モデル現在地MAP</h1>
        </div>
        <div class="top-actions">
          <a id="lineShare" class="share-line" href="#" target="_blank" rel="noreferrer">LINEで共有</a>
          <div class="live-pill"><span></span>リアルタイム</div>
        </div>
      </header>

      <nav class="tabs" aria-label="ページ切り替え">
        <button class="tab active" data-tab="guest">参加者</button>
        <button class="tab" data-tab="staff">スタッフ</button>
        <button class="tab" data-tab="admin">管理</button>
      </nav>

      <section id="guest" class="page active">
        <section class="map-wrap" aria-label="会場MAP">
          <div class="venue-map official-map" id="venueMap">
            <div class="map-tools" aria-label="マップ拡大縮小">
              <button id="zoomOut" type="button" aria-label="縮小">−</button>
              <strong id="zoomValue">100%</strong>
              <button id="zoomIn" type="button" aria-label="拡大">＋</button>
            </div>
            <canvas class="map-canvas" id="mapCanvas" aria-label="潮風公園 公式園内マップ"></canvas>
            <div class="area water">池</div>
            <div class="area grass">芝生</div>
            <div class="area bamboo">竹林</div>
            <div class="area bridge">橋</div>
            <div class="area stairs">階段</div>
            <div class="path path-a"></div>
            <div class="path path-b"></div>
            <div id="markers"></div>
          </div>
          <a class="map-source" href="https://www.tptc.co.jp/cms/tptc/park/pages/pamphlet/shiokaze_5.pdf" target="_blank" rel="noreferrer">潮風公園 公式園内マップを開く</a>
        </section>

        <section class="search-row">
          <input id="search" type="search" placeholder="モデル名で検索" />
          <button id="demoMove" type="button">デモ移動</button>
        </section>

        <section id="detail" class="detail-card"></section>
        <section id="modelList" class="model-list" aria-label="モデル一覧"></section>
      </section>

      <section id="staff" class="page">
        <div class="panel">
          <h2>スタッフページ</h2>
          <label class="field">
            <span>担当モデル</span>
            <div id="staffModelChecks" class="check-list"></div>
          </label>
          <label class="field">
            <span>PIN</span>
            <input id="pin" inputmode="numeric" value="1111" />
          </label>
          <button id="authStaff" class="primary">認証</button>
        </div>

        <div class="panel staff-console locked" id="staffConsole">
          <div class="mode-row">
            <div>
              <p class="eyebrow">撮影会モード</p>
              <strong id="sendState">停止中</strong>
            </div>
            <label class="switch">
              <input id="trackingToggle" type="checkbox" />
              <span></span>
            </label>
          </div>
          <p class="note">iPhone Safariではバックグラウンドで止まる場合があります。画面を開いたまま運用してください。</p>
          <label class="field">
            <span>送信モード</span>
            <select id="trackingMode">
              <option value="single">1人だけ追尾</option>
              <option value="group">選択した複数人をまとめて追尾</option>
              <option value="spot">スポット更新</option>
            </select>
          </label>
          <div class="status-grid">
            <div><span>GPS精度</span><strong id="accuracy">-</strong></div>
            <div><span>最終送信</span><strong id="lastSent">-</strong></div>
          </div>
          <p id="targetSummary" class="note">送信対象を選択してください。</p>
          <div class="spot-grid" id="spotButtons">
            <button data-spot="north-deck">北コーストデッキ</button>
            <button data-spot="sun-plaza">太陽の広場</button>
            <button data-spot="promenade">水と緑のプロムナード</button>
            <button data-spot="fountain">噴水広場</button>
          </div>
          <div class="segmented" id="statusButtons">
            <button data-status="shooting" class="active">撮影中</button>
            <button data-status="break">休憩中</button>
            <button data-status="preparing">準備中</button>
          </div>
          <button id="sendMock" class="secondary">この場所として送信</button>
        </div>
      </section>

      <section id="admin" class="page">
        <div class="panel">
          <h2>管理画面</h2>
          <label class="field">
            <span>イベントURL</span>
            <input id="eventUrl" value="https://www.fresh-club.net/outdoor/detail/1553" />
          </label>
          <button id="parseEvent" class="primary">モデル情報を取得</button>
          <p id="importStatus" class="note"></p>
          <p class="note">取得に失敗しても、下の一覧から手動編集して登録できます。</p>
        </div>

        <div class="admin-actions">
          <button id="allBreak">一括休憩</button>
          <button id="endEvent">イベント終了</button>
        </div>
        <section id="adminList" class="admin-list"></section>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
